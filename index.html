/* ================= 设计令牌 ================= */
:root{
  --desk:#6d6a69;
  --desk-2:#5a5756;
  --leather:#553a2e;
  --leather-dark:#2f201a;
  --leather-ink:#c9a592;
  --paper:#fdfaf5;
  --paper-edge:#ece4d8;
  --ink:#3b2c27;
  --ink-soft:#7d6b62;
  --pink:#ebbcc3;
  --pink-deep:#b9727f;
  --tape:rgba(233,188,195,.62);
  --f-script:"Pinyon Script","Snell Roundhand",cursive;
  --f-hand:"Homemade Apple","Bradley Hand",cursive;
  --f-title:"ZCOOL XiaoWei","Songti SC","STSong",serif;
  --f-body:"Noto Serif SC","Songti SC","SimSun",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --desk:#2c2928; --desk-2:#211f1e; }
}
:root[data-theme="dark"]{ --desk:#2c2928; --desk-2:#211f1e; }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse at 50% 40%, var(--desk) 0%, var(--desk-2) 100%);
  color:var(--ink);
  font-family:var(--f-body);
  overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px 0 20px;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}

/* ================= 舞台与缩放 ================= */
.fit{position:relative}
.stage{position:absolute;top:0;left:0;width:1100px;height:720px;transform-origin:top left;perspective:2600px}
.book{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.6,.05,.25,1);
}
.book.is-closed{transform:translateX(-25%)}

.stitch{
  position:absolute;inset:16px;border-radius:10px;pointer-events:none;
  --th:rgba(240,219,201,.62);       /* 线身 */
  --tip:rgba(120,80,58,.85);        /* 线头没入皮面处 */
  --dash:18px; --gap:12px; --w:2.5px;
  --p:calc(var(--dash) + var(--gap));
  --hole:radial-gradient(ellipse 3.5px 2.6px at 50% 50%, rgba(10,4,1,.8), rgba(10,4,1,.35) 45%, rgba(10,4,1,0) 78%);
  --thH:repeating-linear-gradient(90deg, var(--tip) 0 2.5px, var(--th) 2.5px calc(var(--dash) - 2.5px), var(--tip) calc(var(--dash) - 2.5px) var(--dash), transparent var(--dash) var(--p));
  --thV:repeating-linear-gradient(180deg, var(--tip) 0 2.5px, var(--th) 2.5px calc(var(--dash) - 2.5px), var(--tip) calc(var(--dash) - 2.5px) var(--dash), transparent var(--dash) var(--p));
  background:
    /* 线身 */
    var(--thH) left 0 top 0 / 100% var(--w) no-repeat,
    var(--thH) left 0 bottom 0 / 100% var(--w) no-repeat,
    var(--thV) left 0 top 0 / var(--w) 100% no-repeat,
    var(--thV) right 0 top 0 / var(--w) 100% no-repeat,
    /* 每段线两端的针孔凹影，略向下偏移 */
    var(--hole) left calc(var(--p) / -2) top -2px / var(--p) 7px repeat-x,
    var(--hole) left calc(var(--dash) - var(--p) / 2) top -2px / var(--p) 7px repeat-x,
    var(--hole) left calc(var(--p) / -2) bottom -4px / var(--p) 7px repeat-x,
    var(--hole) left calc(var(--dash) - var(--p) / 2) bottom -4px / var(--p) 7px repeat-x,
    var(--hole) left -2px top calc(var(--p) / -2) / 7px var(--p) repeat-y,
    var(--hole) left -2px top calc(var(--dash) - var(--p) / 2) / 7px var(--p) repeat-y,
    var(--hole) right -4px top calc(var(--p) / -2) / 7px var(--p) repeat-y,
    var(--hole) right -4px top calc(var(--dash) - var(--p) / 2) / 7px var(--p) repeat-y;
  filter:drop-shadow(0 1px .8px rgba(16,6,2,.6));
}

/* ================= 书页（叶片） ================= */
.board-right{position:absolute;top:0;right:0;width:50%;height:100%;border-radius:4px 14px 14px 4px;box-shadow:0 30px 60px rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.3)}
.leaf{
  position:absolute;top:14px;right:18px;width:calc(50% - 18px);height:calc(100% - 28px);
  transform-origin:left center;transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.45,.05,.3,1);
  cursor:pointer;
}
.leaf.cover{top:0;right:0;width:50%;height:100%}
.leaf.static{cursor:default}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{transform:rotateY(180deg)}

.paper{
  background:
    linear-gradient(90deg, rgba(60,40,28,.55) 7px 8px, rgba(60,40,28,.18) 8px 9.5px, transparent 9.5px),
    var(--paper);
  -webkit-mask:linear-gradient(90deg, transparent 0 7px, #000 7px);
          mask:linear-gradient(90deg, transparent 0 7px, #000 7px);
  border-radius:2px 8px 8px 2px;
  box-shadow:inset 0 0 0 1px var(--paper-edge), 3px 0 0 var(--paper-edge), 5px 1px 0 #e3d9cb;
}
.back.paper{
  background:linear-gradient(270deg, rgba(60,40,28,.55) 7px 8px, rgba(60,40,28,.18) 8px 9.5px, transparent 9.5px), var(--paper);
  -webkit-mask:linear-gradient(270deg, transparent 0 7px, #000 7px);
          mask:linear-gradient(270deg, transparent 0 7px, #000 7px);
  border-radius:8px 2px 2px 8px;
  box-shadow:inset 0 0 0 1px var(--paper-edge), -3px 0 0 var(--paper-edge), -5px 1px 0 #e3d9cb;
}
/* 活页孔 */
.paper::before{
  content:"";position:absolute;top:56px;bottom:56px;left:19px;width:12px;
  background:radial-gradient(circle at 6px 6px, #cfc4b6 0 4px, rgba(0,0,0,.14) 4.5px, transparent 5.5px) 0 var(--hole-off,7px)/12px var(--hole-pitch,97px) repeat-y;
}
.back.paper::before{left:auto;right:14px}

.page{position:absolute;inset:0;padding:46px 44px 40px 58px}
.page.vmid{display:flex;flex-direction:column;justify-content:center}
.back .page{padding:46px 58px 40px 44px}
.pno{position:absolute;bottom:18px;font-family:var(--f-hand);font-size:11px;color:var(--ink-soft)}
.face:not(.back) .pno{right:30px}
.back .pno{left:30px}

/* 悬挂粉色标签 */
.tagwrap{position:absolute;top:0;right:40px;filter:drop-shadow(1px 3px 3px rgba(80,40,40,.22));z-index:2}
.back .tagwrap{right:auto;left:auto;right:52px}
.tagwrap::before{content:"";position:absolute;top:0;left:50%;width:1px;height:40px;background:#a8968b}
.tag{
  margin-top:34px;width:54px;padding:30px 0 16px;
  background:
    radial-gradient(circle at 50% 14px, var(--paper) 0 4px, #c58f99 4.5px 5.5px, transparent 6px),
    linear-gradient(170deg, #f3cdd3, var(--pink) 60%, #e3aeb7);
  clip-path:polygon(0 13px,13px 0,calc(100% - 13px) 0,100% 13px,100% 100%,0 100%);
  writing-mode:vertical-rl;text-orientation:upright;
  font-family:"Noto Serif SC",serif;font-weight:700;font-size:22px;letter-spacing:.16em;color:#5d3b42;
  display:flex;align-items:center;justify-content:center;
  transform:rotate(3deg);transform-origin:top center;
}

.hand{font-family:var(--f-hand);font-size:22px;color:#4a3a34;line-height:1.4}
.hand.sm{font-size:14px}
h3{font-family:"Noto Serif SC",serif;font-weight:700;font-size:27px;color:var(--ink)}
p,li{font-size:13.5px;line-height:1.85;color:var(--ink)}
.muted{color:var(--ink-soft)}

/* 纸胶带 */
.tape{position:absolute;width:74px;height:20px;background:var(--tape);box-shadow:0 1px 1px rgba(0,0,0,.05)}
.tape::before,.tape::after{content:"";position:absolute;top:0;bottom:0;width:4px;background:radial-gradient(circle at 0 50%, var(--paper) 2px, transparent 2.5px) 0 0/4px 5px}
.tape::before{left:-2px}.tape::after{right:-2px;transform:scaleX(-1)}

/* ================= 封面（横版，闭合时铺满整本） ================= */
.leaf.cover .front{border-radius:4px 14px 14px 4px}
.cover-art{position:absolute;inset:0;container-type:size;overflow:hidden}
/* 封面光影：最左侧是书脊厚度的暗带，右移先亮后渐暗 */
.cover-art::after{
  content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background:linear-gradient(90deg,
    rgba(18,8,4,.75) 0,
    rgba(18,8,4,.6) 8px,
    rgba(30,14,8,.3) 15px,
    rgba(255,238,225,.13) 5%,
    rgba(255,242,230,.2) 11%,
    rgba(255,240,228,.07) 22%,
    rgba(0,0,0,0) 38%,
    rgba(12,6,3,.1) 62%,
    rgba(12,6,3,.27) 84%,
    rgba(12,6,3,.44) 97%,
    rgba(255,235,220,.14) 99.4%,
    rgba(12,6,3,.45) 100%);
}
.art{position:absolute;inset:0;z-index:1;--u:min(calc(100cqh / 720), calc(100cqw / 560))}
.art > *{position:absolute}
.pos{
  left:calc(var(--x) / 5.6 * 1% - var(--w) * var(--u) / 2);
  top:calc(50% + (var(--y) - 360 - var(--h) / 2) * var(--u));
  width:calc(var(--w) * var(--u));height:calc(var(--h) * var(--u));
  transform:rotate(var(--r,0deg));
}
/* 压印标题 */
.cv-title{
  left:8%;top:calc(50% - 300 * var(--u));white-space:nowrap;line-height:1.05;
  font-family:"Lobster Two","Brush Script MT",cursive;font-style:italic;font-weight:700;font-size:calc(104 * var(--u));
  /* 纯色字面，压印靠描边与上下阴影 */
  color:#c8a996;-webkit-text-fill-color:#c8a996;
  -webkit-text-stroke:calc(1.4 * var(--u)) rgba(40,20,12,.75);paint-order:stroke fill;
  text-shadow:
    0 calc(-2 * var(--u)) calc(1.5 * var(--u)) rgba(10,4,1,.95),
    0 calc(-3.5 * var(--u)) calc(3 * var(--u)) rgba(10,4,1,.6),
    calc(-1.5 * var(--u)) 0 calc(1.5 * var(--u)) rgba(10,4,1,.7),
    0 calc(2 * var(--u)) calc(2 * var(--u)) rgba(255,238,222,.3),
    0 calc(4 * var(--u)) calc(6 * var(--u)) rgba(10,4,1,.55);
}
.cv-title .cap{font-size:1.12em;margin-right:0;vertical-align:-.02em}
.cv-title .sw{font-style:normal}
.cv-title .rm{font-weight:400}
.cv-title .sp{display:inline-block;width:.16em}
.cv-title .cn{position:absolute;left:calc(46 * var(--u));top:calc(118 * var(--u));font-family:"ZCOOL KuaiLe","ZCOOL XiaoWei",sans-serif;font-style:normal;font-weight:400;font-size:.3em;letter-spacing:.08em;color:#c8a996;-webkit-text-fill-color:#c8a996;-webkit-text-stroke:0;text-shadow:0 -.04em .03em rgba(20,8,2,.8), 0 .05em .04em rgba(255,226,205,.25)}
.cv-stars{left:31.2%;top:10%;width:calc(70 * var(--u));height:calc(170 * var(--u))}
.cv-cn{
  left:32.6%;top:35.5%;white-space:nowrap;
  font-family:"ZCOOL KuaiLe","ZCOOL XiaoWei",sans-serif;font-size:calc(38 * var(--u));letter-spacing:.04em;
  color:#dcc1b6;text-shadow:calc(1 * var(--u)) calc(2 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,.55);
}
/* 深色卡片 */
.cv-dark{background:#3e2b25;box-shadow:0 calc(4 * var(--u)) calc(12 * var(--u)) rgba(0,0,0,.45);

  -webkit-mask:
    radial-gradient(var(--s), #0000 97%, #000) round calc(-1.5 * var(--s)) calc(-1.5 * var(--s)) / calc(3 * var(--s)) calc(3 * var(--s)),
    linear-gradient(#000 0 0) calc(1.35 * var(--s)) calc(1.35 * var(--s)) / calc(100% - 2.7 * var(--s)) calc(100% - 2.7 * var(--s)) no-repeat;
  mask:
    radial-gradient(var(--s), #0000 97%, #000) round calc(-1.5 * var(--s)) calc(-1.5 * var(--s)) / calc(3 * var(--s)) calc(3 * var(--s)),
    linear-gradient(#000 0 0) calc(1.35 * var(--s)) calc(1.35 * var(--s)) / calc(100% - 2.7 * var(--s)) calc(100% - 2.7 * var(--s)) no-repeat;
}
.cv-photo{width:100%;height:100%;overflow:hidden;box-shadow:0 0 0 calc(1 * var(--u)) #cfc7bc;background:#dcd6cd}

  color:#8c8378;font-size:calc(14 * var(--u));letter-spacing:.08em;
  background:repeating-linear-gradient(45deg,#e2ddd5 0 calc(10 * var(--u)),#d9d3ca 0 calc(20 * var(--u)))}

/* 绑带与挂饰 */
.cv-band{left:0;right:0;height:calc(6 * var(--u));border-radius:calc(3 * var(--u));
  background:linear-gradient(#ffffff,#e4e0dc 45%,#a9a29c);box-shadow:0 calc(2 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,.55)}
.cv-clasp{height:calc(20 * var(--u));width:calc(40 * var(--u));border-radius:calc(5 * var(--u));background:linear-gradient(#3a3a3a,#0a0a0a 60%,#1c1c1c);box-shadow:0 calc(2 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,.5)}

.cv-clear{ /* 玉髓质地：不透明、蜡感，带云絮状纹理 */
  height:calc(32 * var(--u));width:calc(70 * var(--u));border-radius:calc(9 * var(--u));overflow:hidden;

    radial-gradient(ellipse 60% 45% at 28% 22%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%),

  box-shadow:
    inset 0 calc(2 * var(--u)) calc(3 * var(--u)) rgba(255,255,255,.85),

.cv-flower,.cv-hsmall,.cv-hearts{filter:drop-shadow(calc(1 * var(--u)) calc(3 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,.5))}
/* 布标 */
.cv-label{

/* ================= 封里 ================= */
.inside{border-radius:14px 4px 4px 14px;box-shadow:inset -8px 0 14px rgba(0,0,0,.35)}
.divider{
  position:absolute;top:20px;bottom:20px;left:35%;right:9px;
  background:linear-gradient(90deg,#ddd7ce,#e9e4dc);border-radius:6px;
  box-shadow:0 3px 8px rgba(0,0,0,.3);padding:40px 44px 36px 40px;
}
.divider .spine-tab{position:absolute;left:-26px;top:40px;width:34px;height:150px;background:#f4f0ea;border-radius:8px 0 0 8px;box-shadow:-2px 0 3px rgba(0,0,0,.12);writing-mode:vertical-rl;font-family:var(--f-script);font-size:24px;display:flex;align-items:center;justify-content:center;color:#6b5048}
.toc{list-style:none;margin-top:18px;width:100%}
.toc li{border-bottom:1px dashed #bfb4a6}
.toc button{display:flex;width:100%;align-items:baseline;gap:40px;padding:10px 2px;text-align:left;font-family:var(--f-title);font-size:18px;color:var(--ink)}
.toc button:hover span:first-child{color:var(--pink-deep)}
.toc button span:last-child{margin-left:auto;font-family:var(--f-hand);font-size:12px;color:var(--ink-soft)}
/* ================= 个人介绍 ================= */
.polaroid{position:absolute;right:132px;top:118px;width:178px;padding:11px 11px 14px;background:linear-gradient(160deg,#f6d7dd,#ecbcc6);box-shadow:0 4px 10px rgba(0,0,0,.18);transform:rotate(4deg)}

.polaroid .ph img,.polaroid .ph svg{width:100%;height:100%;object-fit:cover;display:block}
.polaroid small{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:var(--f-hand);font-size:10px;color:#8a7b73}
.polaroid .tape{top:-14px;left:-22px;width:76px;transform:rotate(-45deg);transform-origin:center}
.hi{font-family:var(--f-hand);font-size:18px;color:#6f5c53;margin-top:26px}
.name{font-family:"Noto Serif SC","Songti SC",serif;font-weight:900;font-size:74px;letter-spacing:.02em;margin-top:14px;line-height:1.1;color:#33241f}
.oneline{margin-top:16px;max-width:min(320px,47%);font-size:14.5px;line-height:1.9;color:var(--ink)}
.stats{display:flex;align-items:flex-end;margin-top:38px;padding-top:20px;border-top:1px dashed #d8ccbd;max-width:min(470px,78%)}
.stat{padding-right:20px;margin-right:20px;border-right:1px solid #e3d9cb}
.stat:last-child{border-right:0;padding-right:0;margin-right:0}
.stat b{font-family:var(--f-title);font-weight:400;font-size:28px;line-height:1;color:var(--ink)}
.stat b i{font-style:normal;font-size:13px;margin-left:3px;color:var(--ink-soft)}
.stat small{display:block;margin-top:5px;font-size:11.5px;color:var(--ink-soft)}
.dl{
  align-self:flex-start;display:inline-flex;align-items:center;gap:8px;margin-top:34px;padding:12px 26px;
  background:var(--ink);color:#fdf9f4;border-radius:24px;text-decoration:none;
  font-family:"Noto Serif SC",serif;font-weight:700;font-size:16px;letter-spacing:.04em;
  box-shadow:0 4px 10px rgba(59,44,39,.3);transition:transform .15s, box-shadow .15s;
}
.dl:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(59,44,39,.36)}
.dl span{font-size:16px}
.idline{font-size:13px;color:var(--ink-soft);margin-top:6px}
.intent{
  display:inline-block;margin-top:32px;max-width:290px;padding:10px 14px;
  background:linear-gradient(transparent 55%, rgba(235,188,195,.55) 55%);
  font-family:var(--f-title);font-size:18px;line-height:1.6;
}
.intro{margin-top:22px;max-width:min(520px,72%)}
.intro p+p{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.chip{
  font-size:13.5px;padding:6px 15px;background:#f4eee6;
  border:1px solid #d8ccbd;border-radius:2px;transform:rotate(var(--r,0deg));
}
.chip.pink{background:#f7dde1;border-color:#e2b1b9}

/* ================= 教育背景 ================= */
.edu{margin-top:0;position:relative;padding-left:28px;max-width:min(580px,92%)}
.edu::before{content:"";position:absolute;left:6px;top:12px;bottom:20px;border-left:1.5px dashed #c9b8aa}
.edu-item{position:relative;margin-bottom:40px}
.edu-item::before{content:"";position:absolute;left:-26px;top:9px;width:13px;height:13px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 3px var(--paper),0 0 0 4px #d7a9b1}
.ticket{
  background:#fff;padding:20px 22px 18px;box-shadow:0 2px 6px rgba(0,0,0,.1);
  border-left:4px solid var(--pink);position:relative;
}
.ticket .when{font-family:var(--f-body);font-size:16px;letter-spacing:.04em;color:var(--ink-soft)}
.sch-tag{font-size:16px;font-weight:700;color:var(--pink-deep);margin-left:8px;letter-spacing:.02em}
.ticket h4{font-family:"Noto Serif SC",serif;font-weight:700;font-size:27px;margin:7px 0 4px}
.ticket .deg{font-size:15.5px}
.ticket .badge{position:absolute;right:14px;top:14px;font-size:12.5px;font-weight:700;padding:2px 8px;border:1px solid var(--pink-deep);color:var(--pink-deep);border-radius:10px;transform:rotate(6deg)}
.adv-title{margin-top:22px;max-width:min(580px,92%);padding-top:16px;border-top:1px solid #e3d8cb;
  display:flex;align-items:center;gap:10px;
  font-family:"Noto Serif SC",serif;font-weight:700;font-size:18px;color:var(--ink)}
.adv-title::before{content:"";width:20px;height:11px;background:var(--tape);flex:none}
.adv{margin-top:14px;max-width:min(580px,92%);list-style:none;counter-reset:adv}
.adv li{position:relative;counter-increment:adv;padding-left:28px;margin-bottom:11px;font-size:14px;line-height:1.8}
.adv li:last-child{margin-bottom:0}

.adv b{font-family:"Noto Serif SC",serif;font-weight:700;margin-right:8px}
.memo{margin-top:18px;max-width:min(560px,90%);font-family:var(--f-body);font-size:14.5px;color:var(--ink-soft);border-top:1px solid #e3d8cb;padding-top:14px;line-height:1.9}

/* ================= 实习经历 ================= */
.shot{
  flex:none;background:#fff;padding:6px 6px 8px;box-shadow:0 2px 6px rgba(0,0,0,.12);
  transform:rotate(-1.2deg);
}
.shot .in{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;

}

.edu-item .shot{width:190px;margin-left:22px}

.edu-row{display:flex;align-items:flex-start}
.edu-row .ticket{flex:1}
.job{display:flex;gap:18px}
.job .body{flex:1;min-width:0}
.job .shot{width:172px}
.job .shot .in{aspect-ratio:1}
.split{display:flex;flex-direction:column;gap:28px;height:80%;max-width:min(600px,94%)}
.split .jobs-row{flex:0 0 auto}
.split .summary{flex:1}
.jobs-row{display:flex;gap:22px;align-items:flex-start}
.jobs-row .job{flex:1;min-width:0;display:block}
.jobs-row .job .role{flex-direction:column;align-items:flex-start;gap:2px}
.summary{position:relative;margin-top:0;max-width:100%;padding:20px 24px 18px;
  display:flex;flex-direction:column;justify-content:center;
  background:#fffaf2;border:1px solid #ecdccc;transform:rotate(-.5deg)}
.summary .tape{top:-10px;left:36px;transform:rotate(-4deg)}
.summary h5{font-family:"Noto Serif SC",serif;font-weight:700;font-size:19px;margin-bottom:10px}
.summary p{font-size:13.5px;line-height:1.85;color:var(--ink)}
.job.mini{flex:1;min-width:0;padding:15px 16px 13px}
.job.mini .co{font-size:21px}
.job.mini .role{font-size:12.5px;margin:3px 0 7px}
.job.mini li{font-size:13.5px;line-height:1.75;padding-left:12px}
.job.mini li::before{width:5px;height:5px}
.job.mini .kw{margin-top:8px}
.job.mini .kw span{font-size:11.5px;padding:1px 7px}
.jobs{margin-top:0;display:flex;flex-direction:column;gap:26px;max-width:min(600px,94%)}
.job{position:relative;background:#fff;padding:20px 22px 18px 22px;box-shadow:0 2px 7px rgba(0,0,0,.1)}
.job:nth-child(2){transform:rotate(-.8deg)}
.job:nth-child(1){transform:rotate(.6deg)}
.job .pin{position:absolute;right:-8px;top:-10px;width:16px;height:40px;border:2.5px solid #a9a9a9;border-radius:8px;transform:rotate(18deg)}
.job .pin::after{content:"";position:absolute;left:2px;right:2px;top:6px;bottom:-2px;border:2.5px solid #a9a9a9;border-top:0;border-radius:0 0 6px 6px}
.job .co{font-family:"Noto Serif SC",serif;font-weight:700;font-size:25px}
.job .role{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700;color:var(--pink-deep);margin:2px 0 8px}
.job .role span:last-child{flex:none;color:var(--ink-soft);font-family:var(--f-body);font-weight:400;font-size:13px;letter-spacing:.03em}
.job ul{list-style:none}
.job li{position:relative;padding-left:14px;font-size:14.5px;line-height:1.85}
.job li::before{content:"";position:absolute;left:0;top:.8em;width:6px;height:6px;border-radius:50%;background:var(--pink)}
.job .kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.job .kw span{font-size:12.5px;padding:2px 9px;background:#f6ece4;color:#7a5f55}

/* ================= 技能特长 ================= */
.skills{margin-top:0;display:flex;flex-direction:column;gap:30px;max-width:min(580px,92%)}
.sk h5{font-family:"Noto Serif SC",serif;font-weight:700;font-size:21px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sk h5::before{content:"";width:18px;height:10px;background:var(--tape)}
.sk .chips{margin-top:0;gap:8px}
.quote{
  margin-top:36px;max-width:min(560px,92%);padding:20px 22px;background:#fff8f0;
  border:1px solid #ecdccc;position:relative;transform:rotate(-1deg)
}
.quote .tape{top:-10px;right:30px;transform:rotate(6deg)}
.quote p{font-family:"Noto Serif SC",serif;font-weight:700;font-size:20px;line-height:1.75}
.quote small{display:block;margin-top:6px;font-size:13px;color:var(--ink-soft)}

/* ================= 兴趣爱好 ================= */
.hobbies{margin-top:0;display:grid;grid-template-columns:1fr 1fr;gap:34px 26px;max-width:min(560px,92%)}
.hobby{background:#fff;padding:12px 12px 16px;box-shadow:0 3px 8px rgba(0,0,0,.12);transform:rotate(var(--r,0deg))}
.hobby .pic{height:118px;display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden;background:var(--bg,#f4e7ea)}
.hobby .pic img{width:100%;height:100%;object-fit:cover;display:block}
.hobby b{display:block;font-family:"Noto Serif SC",serif;font-weight:700;font-size:21px;margin-top:10px}
.hobby p{font-size:14px;line-height:1.7;color:var(--ink-soft)}

/* ================= 结尾页 ================= */
.contact{margin-top:30px;list-style:none;max-width:min(420px,72%)}
.contact li{display:flex;gap:16px;padding:13px 0;border-bottom:1px dashed #cfc2b3;font-size:15.5px}
.contact li .ct-k{width:96px;flex:none;display:flex;align-items:center;gap:9px;font-family:"Noto Serif SC",serif;font-weight:700;color:var(--ink-soft)}
.contact li .ct-i{display:inline-flex;width:22px;height:22px;flex:none;color:var(--pink-deep)}
.contact li .ct-i svg{width:100%;height:100%}
.contact a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--pink)}
.bye{font-family:var(--f-script);font-size:64px;color:#8c6259;margin-top:36px;transform:rotate(-4deg)}
.close-btn{align-self:flex-start;margin-top:26px;padding:10px 22px;border:1.5px solid var(--ink);font-family:"Noto Serif SC",serif;font-weight:700;font-size:16px;background:#fff;box-shadow:3px 3px 0 var(--pink)}
.close-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--pink)}

/* ================= 活页圈与索引标签 ================= */
.rings{position:absolute;left:50%;top:118px;bottom:118px;width:74px;margin-left:-37px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;z-index:300;transform:translateZ(60px);opacity:1;transition:opacity .3s .7s}
.rings svg.ring{display:block;width:74px;height:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.rings > svg:not(.ring){position:absolute;width:0;height:0}
.book.is-closed .rings{opacity:0;transition-delay:0s}

.tabs{position:absolute;left:100%;top:90px;display:flex;flex-direction:column;gap:8px;transition:opacity .4s .6s;z-index:1}
.book.is-closed .tabs{opacity:0;pointer-events:none;transition-delay:0s}
.tabs button{
  width:44px;padding:10px 0;margin-left:-4px;
  writing-mode:vertical-rl;font-family:var(--f-title);font-size:14px;letter-spacing:.2em;
  background:#efe8de;color:#6b554c;border-radius:0 8px 8px 0;box-shadow:2px 2px 4px rgba(0,0,0,.25);
  transition:transform .2s, background .2s;
}
.tabs button:hover{transform:translateX(3px)}
.tabs button.on{background:var(--pink);color:#4d2e34;transform:translateX(5px)}

/* ================= 底部控制 ================= */
.controls{display:flex;align-items:center;gap:18px;margin-top:22px;color:#efe6df;font-size:13px;min-height:36px}
.controls button{padding:7px 16px;border:1px solid rgba(255,255,255,.35);border-radius:18px;color:#f3ebe5;transition:background .2s}
.controls button:hover:not(:disabled){background:rgba(255,255,255,.12)}
.controls button:disabled{opacity:.3;cursor:default}
.controls .count{min-width:90px;text-align:center;letter-spacing:.1em;opacity:.8}
.rotate-tip{display:none;color:#eadfd8;font-size:12px;margin-top:10px;opacity:.75}
@media (max-width:700px) and (orientation:portrait){.rotate-tip{display:block}}

@media (prefers-reduced-motion: reduce){
  .book,.leaf{transition-duration:.01s}
}
</style>

<body>

<div class="fit" id="fit">
  <div class="stage" id="stage">
    <div class="book is-closed" id="book">

    ${pno(7)}
  </div>`;

/* 叶片：front 在右页，翻过去后 back 在左页 */
const LEAVES = [
  { cls: "cover", front: [coverArt(), "leather"], back: [insideCover, "leather inside"] },
  { front: [aboutPage, "paper"], back: [eduPage, "paper"] },
  { front: [jobPage1, "paper"], back: [jobPage2, "paper"] },
  { front: [skillPage, "paper"], back: [hobbyPage, "paper"] }
];
const SPREAD_LABEL = ["封面", "个人介绍", "教育 / 实习", "实习 / 技能", "爱好 / 联系"];
const TABS = [["介绍",1],["教育",2],["实习",2],["技能",3],["爱好",4],["联系",4]];

/* ================= 构建 ================= */
const book = document.getElementById("book");
const rings = book.querySelector(".rings");


const endLeaf = document.createElement("div");
endLeaf.className = "leaf static";
endLeaf.style.zIndex = 1;
endLeaf.innerHTML = `<div class="face paper">${endPage}</div>`;
book.insertBefore(endLeaf, rings);

const leaves = LEAVES.map((L) => {
  const el = document.createElement("div");
  el.className = "leaf" + (L.cls ? " " + L.cls : "");
  el.innerHTML = `<div class="face front ${L.front[1]}">${L.front[0]}</div><div class="face back ${L.back[1]}">${L.back[0]}</div>`;
  book.insertBefore(el, rings);
  return el;
});
const N = leaves.length;

const tabsEl = document.getElementById("tabs");
tabsEl.innerHTML = TABS.map(([t,k]) => `<button data-go="${k}">${t}</button>`).join("");

/* ================= 翻页逻辑 ================= */
let k = 0;            // 已翻过的叶片数
let zTop = 0;
const moving = new Set();
const FLIP_MS = 1000;

function innerVis(){
  // 合上时隐藏内页，避免封面接缝处透出白边
  const hide = k === 0 && moving.size === 0;
  leaves.slice(1).concat(endLeaf).forEach(l => { l.style.visibility = hide ? "hidden" : ""; });
}
function layerZ(){
  innerVis();
  leaves.forEach((l, i) => {
    if (moving.has(l)) return;
    l.style.zIndex = i < k ? i + 2 : 2 * N - i + 2;
  });
}
function ui(){
  book.classList.toggle("is-closed", k === 0);
  innerVis();
  document.getElementById("count").textContent = SPREAD_LABEL[k];
  document.getElementById("prev").disabled = k === 0;
  const next = document.getElementById("next");
  next.disabled = k === N;
  next.textContent = k === 0 ? "翻开" : "下一页";
  tabsEl.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", TABS[i][1] === k && TABS.findIndex(t=>t[1]===k) === i));
  // 背面朝外的页里的按钮不可聚焦
  leaves.forEach((l, i) => {
    l.querySelector(".front").inert = i < k;
    l.querySelector(".back").inert = i >= k;
  });
}
function flip(dir){
  if (dir > 0 && k >= N) return;
  if (dir < 0 && k <= 0) return;
  const leaf = dir > 0 ? leaves[k] : leaves[k - 1];
  moving.add(leaf);
  leaf.style.zIndex = 100 + (zTop++ % 20);   // 始终低于装订环(300)，纸从环下穿过
  k += dir;
  leaf.classList.toggle("flipped", dir > 0);
  ui();
  setTimeout(() => { moving.delete(leaf); layerZ(); }, FLIP_MS);
}
let queue = null;
function goTo(target){
  clearInterval(queue);
  if (target === k) return;
  const dir = target > k ? 1 : -1;
  flip(dir);
  queue = setInterval(() => {
    if (k === target) return clearInterval(queue);
    flip(dir);
  }, 260);
}

book.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { e.stopPropagation(); goTo(+go.dataset.go); return; }
  if (e.target.closest("a")) return;
  const leaf = e.target.closest(".leaf");
  if (!leaf || leaf.classList.contains("static")) return;
  flip(leaf.classList.contains("flipped") ? -1 : 1);
});
document.getElementById("prev").onclick = () => flip(-1);
document.getElementById("next").onclick = () => flip(1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") flip(1);
  if (e.key === "ArrowLeft") flip(-1);
  if (e.key === "Escape") goTo(0);
});
let tx = null;
document.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) flip(dx < 0 ? 1 : -1);
  tx = null;
});

/* ================= 自适应缩放 ================= */
const BH = 720, SIDE = 48, MIN_BW = 900;   // SIDE：左右各留给索引标签的空间
function fit(){
  const vw = document.documentElement.clientWidth;
  const vh = window.innerHeight;
  // 扣掉底部按钮、提示和上下留白后，本子可用的高度
  const ctrl = document.querySelector(".controls");
  const tip = document.querySelector(".rotate-tip");
  const used = ctrl.offsetHeight + 22 + (tip.offsetHeight ? tip.offsetHeight + 10 : 0) + 36;
  // 高度刚好占满一屏，再按屏幕宽度算出本子的宽度，于是横向也铺满
  let s = (vh - used) / BH;
  let bw = vw / s - SIDE * 2;
  if (bw < MIN_BW) {            // 窄屏兜底：保证内容排得下，此时以宽度为准
    bw = MIN_BW;
    s = vw / (bw + SIDE * 2);
  }
  const stage = document.getElementById("stage");
  stage.style.width = bw + "px";
  stage.style.left = SIDE * s + "px";
  stage.style.transform = `scale(${s})`;
  const f = document.getElementById("fit");
  f.style.width = vw + "px";
  f.style.height = BH * s + "px";
  fitTitle();
  alignHoles();
}
// 让纸张上的打孔正好落在钢环穿过的位置
function alignHoles(){
  const box = document.querySelector(".rings");
  const rs = box ? [...box.querySelectorAll("svg.ring")] : [];
  if (rs.length < 2) return;
  const c = r => box.offsetTop + r.offsetTop + r.offsetHeight / 2;
  document.documentElement.style.setProperty("--hole-pitch", (c(rs[1]) - c(rs[0])) + "px");
  document.documentElement.style.setProperty("--hole-off", (c(rs[0]) - 62) + "px");
}
// 标题用的是网络字体，万一没加载成功就按封面宽度收一下，避免超出封面
function fitTitle(){
  const art = document.querySelector(".leaf.cover .cover-art");
  const t = art && art.querySelector(".cv-title");
  if (!t) return;
  t.style.fontSize = "";
  const allowed = art.clientWidth * 0.82;
  const w = t.getBoundingClientRect().width;
  if (w > allowed) t.style.fontSize = parseFloat(getComputedStyle(t).fontSize) * allowed / w + "px";
  // 粉色卡片上的文字同样不超出卡片
  const card = art.querySelector(".cv-pink"), word = card && card.querySelector(".word");
  if (word) {
    word.style.fontSize = "";
    const room = card.clientWidth * 0.88;
    const ww = word.getBoundingClientRect().width;
    if (ww > room) word.style.fontSize = parseFloat(getComputedStyle(word).fontSize) * room / ww + "px";
  }
  // 布标上的名字同理
  const lb = art.querySelector(".cv-label"), nm = lb && lb.querySelector("b");
  if (nm) {
    nm.style.fontSize = "";
    const room2 = lb.clientWidth * 0.9;
    const nw = nm.getBoundingClientRect().width;
    if (nw > room2) nm.style.fontSize = parseFloat(getComputedStyle(nm).fontSize) * room2 / nw + "px";
  }
}
addEventListener("resize", fit);
if (window.visualViewport) visualViewport.addEventListener("resize", fit);
if (document.fonts) document.fonts.ready.then(fit);
addEventListener("load", fit);
fit(); layerZ(); ui();
</script>
